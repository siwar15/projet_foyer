version: '3.8'

services:
  backend:
    image: mouadhs/reservation_management:latest   # Use the pre-built image from Docker Hub
    restart: on-failure

    networks:
      - jenkins-sonarqube-network  # Use the network defined below
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url"  : "jdbc:mysql://db:3306/db?createDatabaseIfNotExist=true",
        "spring.datasource.username" : "root",
        "spring.datasource.password" : "root",
        "spring.jpa.properties.hibernate.dialect": "org.hibernate.dialect.MySQLDialect",
        "spring.jpa.hibernate.ddl-auto" : "update"
      }'
    stdin_open: true
    tty: true
    ports:
      - "8089:8089"  # Expose the backend on port 8080
    depends_on:
      - db

  db:
    image: mysql:8.0
    networks:
      - jenkins-sonarqube-network  # Use the network defined below
    environment:
      MYSQL_ROOT_PASSWORD: root  # Set the MySQL root password
      MYSQL_DATABASE: db  # Create a database on startup
    ports:
      - "3306:3306"  # Expose the database on port 3306
    volumes:
      - mysql_data:/var/lib/mysql  # Persist data across container restarts

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - jenkins-sonarqube-network

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - jenkins-sonarqube-network

networks:
  jenkins-sonarqube-network:  # Define the network here
    external: true

volumes:
  mysql_data:  # Named volume for MySQL data persistence
