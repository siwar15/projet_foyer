version: '3.8'

services:
  backend:
    image: mouadhs/reservation_management:latest   # Use the pre-built image from Docker Hub
    environment:
      - DATABASE_URL=jdbc:mysql://db:3306/db?createDatabaseIfNotExist=true
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=root_password
    ports:
      - "8081:8080"  # Expose the backend on port 8080
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root  # Set the MySQL root password
      MYSQL_DATABASE: reservation_db      # Create a database on startup
    ports:
      - "3306:3306"  # Expose the database on port 3306
    volumes:
      - mysql_data:/var/lib/mysql  # Persist data across container restarts

volumes:
  mysql_data:  # Named volume for MySQL data persistence
